# R2 - Services de développement local
# PostgreSQL remplacé par SQLite pour éviter les problèmes d'encodage Windows
# Redis pour le cache

version: '3.8'

services:
  r2-redis:
    image: redis:7-alpine
    container_name: r2-redis
    ports:
      - "6379:6379"
    volumes:
      - r2_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  r2_redis_data:
